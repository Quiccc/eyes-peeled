# The checks from AGENTS.md, one job per part of the repo.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Admin panel build
        working-directory: server/admin
        run: npm ci && npm run build

  yolo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yolo
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      # CPU-only PyTorch: the default wheels bundle CUDA and are several GB.
      - run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      # The real-model tests download yolo11s.pt on first use.
      - run: uv run pytest
